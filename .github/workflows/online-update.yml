name: online-update-btc-direction

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, windows, gpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update data and models incrementally
        run: |
          python scripts/online_update_xgb.py

      - name: Upload online artifacts
        uses: actions/upload-artifact@v4
        with:
          name: online-update-artifacts
          path: |
            reports/online_update_metrics.csv
            artifacts/online_state.json
            models/xgb_h*.json

      - name: Commit updated online artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/online_update_metrics.csv artifacts/online_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: online xgb update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
