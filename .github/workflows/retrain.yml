name: retrain-btc-direction

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  retrain:
    # Requires a self-hosted GPU runner to preserve CUDA acceleration.
    runs-on: [self-hosted, windows, gpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline
        run: |
          python scripts/run_full_pipeline.py --with-lstm --with-blend

      - name: Generate analysis plots
        run: |
          python scripts/analyze_reports.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btc-direction-artifacts
          path: |
            reports/*.parquet
            reports/*.png
            models/*.json
            models/*.pt

      - name: Commit updated reports and models
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/summary.json reports/weighted_multi_horizon_metrics.json reports/weighted_signal_policy_metrics.json reports/best_signal_policy.json reports/holdout_metrics.csv reports/signal_policy_metrics.csv reports/signal_policy_thresholds.csv reports/lstm_holdout_metrics.csv reports/blend_holdout_metrics.csv reports/blend_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated retrain $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
